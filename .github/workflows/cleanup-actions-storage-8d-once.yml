name: Audit Actions Storage (Read Only)
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/cleanup-actions-storage-8d-once.yml']
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Report current Actions artifacts and caches
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, { owner, repo, per_page: 100 });
            let artifacts_count = 0, artifacts_bytes = 0, expired_artifacts_count = 0;
            for (const a of artifacts) { if (a.expired) { expired_artifacts_count++; continue; } artifacts_count++; artifacts_bytes += Number(a.size_in_bytes || 0); }
            const caches = await github.paginate(github.rest.actions.getActionsCacheList, { owner, repo, per_page: 100 });
            let caches_count = 0, caches_bytes = 0;
            for (const c of caches) { caches_count++; caches_bytes += Number(c.size_in_bytes || 0); }
            const result = { repo: `${owner}/${repo}`, artifacts_count, artifacts_bytes, expired_artifacts_count, caches_count, caches_bytes, total_bytes: artifacts_bytes + caches_bytes, audited_at: new Date().toISOString() };
            core.info(`AUDIT_SUMMARY_JSON ${JSON.stringify(result)}`);
